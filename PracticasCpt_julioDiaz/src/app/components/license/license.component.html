<div class="p-fluid">
    <form [formGroup]="licenseForm" (ngSubmit)="onSubmit()">
        <div class="p-field">
            <label for="date_ini">Fecha de inicio</label>
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-calendar-times"></i></span>
                <p-calendar id="date_ini" formControlName = "date_ini"></p-calendar>
            </div>
            <div *ngIf="licenseForm.controls['date_ini'].invalid && licenseForm.controls['date_ini'].touched" class="error">
                La fecha de inicio es requerido 📆
            </div>
        </div>
        <div class="p-field">
            <label for="date_fi">Fecha de finalización</label>
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-calendar-times"></i></span>
                <p-calendar id="date_fi" formControlName = "date_fi"></p-calendar>
            </div>
            <div *ngIf="licenseForm.controls['date_fi'].invalid && licenseForm.controls['date_fi'].touched" class="error">
                La fecha de finalización es requerido 🗓️
            </div>
        </div>
        <div class="p-field">
            <label for="notes">Notas</label>
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-align-left"></i></span>
                <textarea pInputTextarea formControlName="notes"></textarea>
            </div>
        </div>
    </form>
</div>
